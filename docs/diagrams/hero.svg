<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-scale="1.5" width="1600" height="640" viewBox="0 0 1600 640" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <!-- README hero. Embeds ../console-highways.png, so render.mjs renders the console scenes first. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/><stop offset=".55" stop-color="#0e1530"/><stop offset="1" stop-color="#181238"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2f7bff" stop-opacity=".55"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowViolet" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9b5cff" stop-opacity=".45"/><stop offset="1" stop-color="#9b5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowTeal" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#19c9b8" stop-opacity=".35"/><stop offset="1" stop-color="#19c9b8" stop-opacity="0"/></radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb2ff"/><stop offset=".5" stop-color="#b48cff"/><stop offset="1" stop-color="#48e0cf"/>
    </linearGradient>
    <linearGradient id="roadViolet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b48cff" stop-opacity="0"/><stop offset=".45" stop-color="#b48cff" stop-opacity=".9"/><stop offset="1" stop-color="#b48cff" stop-opacity=".15"/></linearGradient>
    <linearGradient id="roadTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48e0cf" stop-opacity="0"/><stop offset=".5" stop-color="#48e0cf" stop-opacity=".85"/><stop offset="1" stop-color="#48e0cf" stop-opacity=".15"/></linearGradient>
    <linearGradient id="roadAmber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb547" stop-opacity="0"/><stop offset=".55" stop-color="#ffb547" stop-opacity=".8"/><stop offset="1" stop-color="#ffb547" stop-opacity=".15"/></linearGradient>
    <linearGradient id="roadBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5c9dff" stop-opacity="0"/><stop offset=".5" stop-color="#5c9dff" stop-opacity=".8"/><stop offset="1" stop-color="#5c9dff" stop-opacity=".15"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff"/></pattern>
    <clipPath id="card"><rect width="1600" height="640" rx="28"/></clipPath>
    <clipPath id="screen"><rect x="900" y="132" width="640" height="546"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="2.4"/></filter>
    <style>
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: .14em; fill: #9fb7ff; }
      .word { font-size: 62px; font-weight: 700; letter-spacing: -.01em; }
      .tag { font-size: 34px; font-weight: 600; fill: #ffffff; letter-spacing: -.005em; }
      .lead { font-size: 18px; fill: #a7b2cf; }
      .chip { font-size: 14px; font-weight: 600; fill: #dfe6ff; }
      .banner { font-size: 15px; fill: #ffffff; }
      .btn { font-size: 13px; font-weight: 600; fill: #ffffff; }
      .wtitle { font-size: 13px; font-weight: 600; fill: #e8ecf8; }
      .ftitle { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .fsub { font-size: 12.5px; fill: #b7c0dc; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1600" height="640" fill="url(#bg)"/>
    <rect width="1600" height="640" fill="url(#dots)" opacity=".06"/>
    <ellipse cx="1250" cy="60" rx="520" ry="300" fill="url(#glowBlue)"/>
    <ellipse cx="820" cy="660" rx="460" ry="260" fill="url(#glowViolet)"/>
    <ellipse cx="120" cy="-40" rx="420" ry="260" fill="url(#glowTeal)"/>

    <!-- Highways sweeping into the console -->
    <g fill="none" stroke-linecap="round">
      <path d="M-40 560 C 360 600, 620 300, 1000 250 S 1500 180, 1680 120" stroke="url(#roadViolet)" stroke-width="3"/>
      <path d="M-40 600 C 420 640, 660 400, 1020 370 S 1480 330, 1680 300" stroke="url(#roadTeal)" stroke-width="3"/>
      <path d="M-40 640 C 460 660, 720 520, 1040 500 S 1460 470, 1680 470" stroke="url(#roadAmber)" stroke-width="3"/>
      <path d="M-40 520 C 300 540, 560 190, 960 150 S 1500 60, 1680 30" stroke="url(#roadBlue)" stroke-width="2" opacity=".7"/>
      <path d="M-40 560 C 360 600, 620 300, 1000 250 S 1500 180, 1680 120" stroke="#b48cff" stroke-width="8" opacity=".18" filter="url(#blur)"/>
      <path d="M-40 600 C 420 640, 660 400, 1020 370 S 1480 330, 1680 300" stroke="#48e0cf" stroke-width="8" opacity=".16" filter="url(#blur)"/>
      <path d="M-40 640 C 460 660, 720 520, 1040 500 S 1460 470, 1680 470" stroke="#ffb547" stroke-width="8" opacity=".14" filter="url(#blur)"/>
    </g>

    <!-- Console window, bleeding off the bottom edge -->
    <g filter="url(#shadow)">
      <rect x="900" y="96" width="640" height="600" rx="14" fill="#f3f5fa"/>
    </g>
    <rect x="900" y="96" width="640" height="36" rx="14" fill="#1f2333"/>
    <rect x="900" y="118" width="640" height="14" fill="#1f2333"/>
    <circle cx="922" cy="114" r="5" fill="#ff5f57"/><circle cx="940" cy="114" r="5" fill="#febc2e"/><circle cx="958" cy="114" r="5" fill="#28c840"/>
    <text class="wtitle" x="1220" y="119" text-anchor="middle">figma-cli-ultimate · Worker console</text>
    <image clip-path="url(#screen)" href="../console-highways.png" xlink:href="../console-highways.png" x="900" y="132" width="640" height="546" preserveAspectRatio="xMidYMin slice"/>

    <!-- Floating card: taking turns -->
    <g filter="url(#soft)">
      <rect x="796" y="452" width="330" height="112" rx="16" fill="#141a33" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".16"/>
    </g>
    <text class="ftitle" x="818" y="482">Two agents, one file: taking turns</text>
    <text class="fsub" x="818" y="503">The plugin thread switches every 100 nodes</text>
    <g>
      <rect x="818" y="520" width="44" height="14" rx="4" fill="#b48cff"/>
      <rect x="866" y="520" width="18" height="14" rx="4" fill="#48e0cf"/>
      <rect x="888" y="520" width="44" height="14" rx="4" fill="#b48cff"/>
      <rect x="936" y="520" width="18" height="14" rx="4" fill="#48e0cf"/>
      <rect x="958" y="520" width="44" height="14" rx="4" fill="#b48cff"/>
      <rect x="1006" y="520" width="18" height="14" rx="4" fill="#48e0cf"/>
      <rect x="1028" y="520" width="76" height="14" rx="4" fill="#b48cff"/>
    </g>
    <circle cx="822" cy="550" r="4" fill="#b48cff"/><text class="fsub" x="832" y="554">long build</text>
    <circle cx="912" cy="550" r="4" fill="#48e0cf"/><text class="fsub" x="922" y="554">quick reads, between slices</text>

    <!-- Copy -->
    <rect x="80" y="92" width="336" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#9fb7ff" stroke-opacity=".45"/>
    <circle cx="100" cy="108" r="4.5" fill="#48e0cf"/>
    <text class="eyebrow" x="114" y="113">STRUCTURED BRIDGE · FIGMA 126+</text>

    <text class="word" x="78" y="206"><tspan fill="#ffffff">figma-cli-</tspan><tspan fill="url(#word)">ultimate</tspan></text>
    <text class="tag" x="80" y="268">Many AI agents. One Figma.</text>
    <text class="tag" x="80" y="312">Each on its own highway.</text>
    <text class="lead" x="80" y="362">A lobby hands every agent a private port. Jobs take turns</text>
    <text class="lead" x="80" y="388">instead of queueing, failures stay on their own road, and a</text>
    <text class="lead" x="80" y="414">live console inside Figma shows who is writing where.</text>

    <!-- The real banner the plugin starts as -->
    <rect x="80" y="452" width="420" height="44" rx="12" fill="#000000" fill-opacity=".75" stroke="#ffffff" stroke-opacity=".35"/>
    <circle cx="100" cy="474" r="4.5" fill="#34c759"/>
    <text class="banner" x="114" y="479">figma CLI - Connected - 3456</text>
    <rect x="378" y="461" width="110" height="26" rx="8" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
    <text class="btn" x="433" y="479" text-anchor="middle">Show details</text>

    <!-- Feature chips -->
    <g>
      <rect x="80" y="528" width="104" height="34" rx="17" fill="#b48cff" fill-opacity=".14" stroke="#b48cff" stroke-opacity=".5"/>
      <text class="chip" x="132" y="550" text-anchor="middle">Highways</text>
      <rect x="194" y="528" width="118" height="34" rx="17" fill="#48e0cf" fill-opacity=".12" stroke="#48e0cf" stroke-opacity=".5"/>
      <text class="chip" x="253" y="550" text-anchor="middle">Turn-taking</text>
      <rect x="322" y="528" width="128" height="34" rx="17" fill="#ffb547" fill-opacity=".12" stroke="#ffb547" stroke-opacity=".5"/>
      <text class="chip" x="386" y="550" text-anchor="middle">Scoped holds</text>
      <rect x="460" y="528" width="114" height="34" rx="17" fill="#5c9dff" fill-opacity=".14" stroke="#5c9dff" stroke-opacity=".5"/>
      <text class="chip" x="517" y="550" text-anchor="middle">Canvas map</text>
      <rect x="584" y="528" width="124" height="34" rx="17" fill="#ff6b8b" fill-opacity=".12" stroke="#ff6b8b" stroke-opacity=".5"/>
      <text class="chip" x="646" y="550" text-anchor="middle">Live console</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1599" height="639" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
