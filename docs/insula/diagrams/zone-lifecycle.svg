<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6475"/></marker>
    <pattern id="held" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fcebea"/><rect width="4" height="10" fill="#f3c4c0"/></pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#c7cdd8"/></pattern>
    <style>
      .title { font-size: 26px; font-weight: 600; fill: #1c1c1e; }
      .subtitle { font-size: 15px; fill: #636366; }
      .state { font-size: 17px; font-weight: 700; fill: #1c1c1e; }
      .s { font-size: 12.5px; fill: #4b5563; }
      .t { font-size: 12.5px; fill: #1f2937; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: .05em; }
    </style>
  </defs>
  <rect width="1400" height="640" fill="#ffffff"/>
  <text class="title" x="40" y="50">A zone's life, and how the canvas map draws it</text>
  <text class="subtitle" x="40" y="76">A zone is a page rectangle plus a gutter, reserved atomically before anything is created in it.</text>

  <!-- States -->
  <g>
    <rect x="40" y="130" width="250" height="160" rx="14" fill="#ffffff" stroke="#0066cc" stroke-width="1.5"/>
    <text class="state" x="60" y="160">reserved</text>
    <rect x="60" y="176" width="210" height="62" rx="6" fill="url(#dots)" stroke="#d1d8e5"/>
    <rect x="96" y="186" width="138" height="42" rx="4" fill="#e6efff" stroke="#0066cc" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="s" x="60" y="258">Admitted, waiting its turn.</text><text class="s" x="60" y="276">Map: dashed outline.</text>
  </g>
  <g>
    <rect x="390" y="130" width="250" height="160" rx="14" fill="#ffffff" stroke="#8b4ad2" stroke-width="1.5"/>
    <text class="state" x="410" y="160">running</text>
    <rect x="410" y="176" width="210" height="62" rx="6" fill="url(#dots)" stroke="#d1d8e5"/>
    <rect x="446" y="186" width="138" height="42" rx="4" fill="#f6f2fd" stroke="#8b4ad2" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="446" y="224" width="80" height="4" fill="#8b4ad2"/>
    <text class="s" x="410" y="258">Creating; checked at every yield.</text><text class="s" x="410" y="276">Map: marching outline + progress.</text>
  </g>
  <g>
    <rect x="740" y="130" width="250" height="160" rx="14" fill="#ffffff" stroke="#248a3d" stroke-width="1.5"/>
    <text class="state" x="760" y="160">committed</text>
    <rect x="760" y="176" width="210" height="62" rx="6" fill="url(#dots)" stroke="#d1d8e5"/>
    <rect x="796" y="186" width="138" height="42" rx="4" fill="#eef8f1" stroke="#248a3d" stroke-width="1.5" opacity=".6"/>
    <rect x="806" y="194" width="50" height="26" rx="3" fill="#248a3d" opacity=".35"/><rect x="866" y="194" width="58" height="26" rx="3" fill="#248a3d" opacity=".35"/>
    <text class="s" x="760" y="258">Validated twice, receipt saved.</text><text class="s" x="760" y="276">Map: fades out over 2 minutes.</text>
  </g>
  <g>
    <rect x="1090" y="130" width="270" height="160" rx="14" fill="#f7f7f8" stroke="#9aa3b2"/>
    <text class="state" x="1110" y="160">artwork</text>
    <rect x="1110" y="176" width="230" height="62" rx="6" fill="url(#dots)" stroke="#d1d8e5"/>
    <rect x="1152" y="194" width="50" height="26" rx="3" fill="#9aa3b2" opacity=".45"/><rect x="1212" y="194" width="58" height="26" rx="3" fill="#9aa3b2" opacity=".45"/>
    <text class="s" x="1110" y="258">Counted per file, not drawn; the</text><text class="s" x="1110" y="276">frames join the gray page sketch.</text>
  </g>
  <g>
    <rect x="390" y="400" width="250" height="160" rx="14" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.5"/>
    <text class="state" x="410" y="430">released</text>
    <rect x="410" y="446" width="210" height="62" rx="6" fill="url(#dots)" stroke="#d1d8e5"/>
    <text class="s" x="452" y="482">(nothing drawn)</text>
    <text class="s" x="410" y="528">Area free again. Safe to retry:</text><text class="s" x="410" y="546">nothing was left on the canvas.</text>
  </g>
  <g>
    <rect x="740" y="400" width="250" height="160" rx="14" fill="#ffffff" stroke="#b82b23" stroke-width="1.5"/>
    <text class="state" x="760" y="430">held</text>
    <rect x="760" y="446" width="210" height="62" rx="6" fill="url(#dots)" stroke="#d1d8e5"/>
    <rect x="796" y="456" width="138" height="42" rx="4" fill="url(#held)" stroke="#b82b23" stroke-width="1.5"/>
    <text class="s" x="760" y="528">Outcome unknown; area protected.</text><text class="s" x="760" y="546">Only its own channel is blocked.</text>
  </g>

  <!-- Transitions -->
  <path d="M290 210 H386" stroke="#5b6475" stroke-width="2" marker-end="url(#a)"/><text class="t" x="300" y="200">turn starts</text>
  <path d="M640 210 H736" stroke="#5b6475" stroke-width="2" marker-end="url(#a)"/><text class="t" x="652" y="200">succeeded</text>
  <path d="M990 210 H1086" stroke="#5b6475" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text class="t" x="1000" y="200">after 2 min</text>
  <path d="M500 290 V396" stroke="#5b6475" stroke-width="2" marker-end="url(#a)"/><text class="t" x="508" y="336">rolled back</text><text class="t" x="508" y="354">(cancel, conflict,</text><text class="t" x="508" y="372">overflow)</text>
  <path d="M600 290 C650 340 700 360 760 396" stroke="#5b6475" stroke-width="2" fill="none" marker-end="url(#a)"/><text class="t" x="642" y="338">partial, uncertain,</text><text class="t" x="642" y="356">plugin lost</text>
  <path d="M165 290 C165 480 260 480 386 480" stroke="#5b6475" stroke-width="2" fill="none" marker-end="url(#a)"/><text class="t" x="176" y="420">not started: queue</text><text class="t" x="176" y="438">timeout, cancel,</text><text class="t" x="176" y="456">highway closed</text>
  <path d="M870 400 V294" stroke="#248a3d" stroke-width="2" marker-end="url(#a)"/><text class="t" x="878" y="336">reconcile:</text><text class="t" x="878" y="354">proof of commit</text>
  <path d="M740 500 H644" stroke="#5b6475" stroke-width="2" marker-end="url(#a)"/>
  <text class="t" x="660" y="590">reconcile: proof of rollback,</text><text class="t" x="660" y="608">or release after review</text>
  <path d="M692 584 V506" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Side note -->
  <rect x="1040" y="330" width="320" height="230" rx="14" fill="#f4f6fb"/>
  <text class="tag" x="1060" y="358" fill="#3f64a6">WHAT ELSE IS ON THE MAP</text>
  <rect x="1060" y="376" width="40" height="26" rx="4" fill="#f6f2fd" stroke="#8b4ad2" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text class="s" x="1112" y="388">A request without a zone (update,</text><text class="s" x="1112" y="404">batch, read, export): its target</text><text class="s" x="1112" y="420">frame, or the whole page.</text>
  <rect x="1060" y="446" width="40" height="26" rx="4" fill="#9aa3b2" opacity=".4"/>
  <text class="s" x="1112" y="458">Coarse artwork sketch: top-level</text><text class="s" x="1112" y="474">frames on a 48 × 30 grid, with</text><text class="s" x="1112" y="490">the time it was measured.</text>
  <text class="s" x="1060" y="526">Zones are exact page rectangles.</text><text class="s" x="1060" y="544">The sketch never loads a page.</text>
</svg>
